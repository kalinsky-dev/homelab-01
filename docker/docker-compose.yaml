services:

  nginx:

    image: nginx:1.28-alpine

    container_name: nginx

    restart: unless-stopped

    ports:
      - "8080:80"

    networks:
      - homelab-net

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost || exit 1"]    
      interval: 30s
      timeout: 10s
      retries: 3


  postgres:

    image: postgres:17

    container_name: postgres

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - homelab-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 10s
      retries: 5


  redis:

    image: redis:8-alpine

    container_name: redis

    restart: unless-stopped

    networks:
      - homelab-net

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5


networks:

  homelab-net:


volumes:

  postgres-data:
