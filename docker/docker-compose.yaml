services:

  nginx:

    image: nginx:1.28-alpine

    container_name: nginx

    restart: unless-stopped

    ports:
      - "8080:80"

    networks:
      - homelab-net



  postgres:

    image: postgres:17

    container_name: postgres

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - homelab-net



  redis:

    image: redis:8-alpine

    container_name: redis

    restart: unless-stopped

    networks:
      - homelab-net



networks:

  homelab-net:



volumes:

  postgres-data:
