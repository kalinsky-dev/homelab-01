name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > docker/.env <<'EOF'
          POSTGRES_USER=ci_user
          POSTGRES_PASSWORD=ci_password
          POSTGRES_DB=ci_database
          EOF

      - name: Validate repository structure
        run: |
          test -f README.md
          test -f docker/docker-compose.yaml
          test -f scripts/healthcheck.sh

      - name: Validate Docker Compose
        run: docker compose -f docker/docker-compose.yaml config

      - name: Pull Docker images
        run: docker compose -f docker/docker-compose.yaml pull

      - name: Check shell script syntax
        run: bash -n scripts/healthcheck.sh
